<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👑 리틀원주방</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css"/>
<style>
:root {
  --bg:#FDFBF7; --white:#fff; --tm:#4A3F35; --ts:#A39B93;
  --gl:#FFF0B3; --gold:#FFC93C; --gd:#FF9A00;
  --peach:#FF8A76; --mint:#38E0C4; --border:#F0EAE1;
  --ssm:0 4px 12px rgba(200,180,150,.1); --smd:0 8px 24px rgba(255,180,0,.15);
  --sp:0 8px 24px rgba(255,138,118,.2);
  --bar0:#FF8A76; --bar1:#749CFF; --bar2:#38E0C4; --bar3:#FFB347; --bar4:#FF6B9D; --bar5:#A8E6CF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--tm);min-height:100vh;overflow-x:hidden;padding-bottom:90px;}
.float-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.float-emoji{position:absolute;opacity:.12;animation:floatUp linear infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.1));}
@keyframes floatUp{0%{transform:translateY(110vh) rotate(0deg) scale(.8);opacity:0}10%{opacity:.12}90%{opacity:.12}100%{transform:translateY(-10vh) rotate(360deg) scale(1.2);opacity:0}}
/* 탭바 */
.tab-nav{display:flex;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-radius:50px;padding:5px;box-shadow:0 8px 32px rgba(150,130,110,.18);border:1px solid rgba(255,255,255,.9);z-index:100;width:92%;max-width:420px;}
.tab-btn{flex:1;padding:13px 8px;background:transparent;border:none;color:var(--ts);font-family:'Pretendard',sans-serif;font-size:13px;font-weight:700;border-radius:40px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);}
.tab-btn.active{background:linear-gradient(135deg,var(--gold),var(--gd));color:#5A3E00;box-shadow:0 4px 12px rgba(255,180,0,.3);}
.tab-content{display:none;position:relative;z-index:1;animation:fadeIn .35s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.container{padding:20px;max-width:520px;margin:0 auto;}
.section-title{font-family:'Jua',sans-serif;font-size:20px;margin:28px 0 14px;color:var(--tm);display:flex;align-items:center;gap:8px;}

/* 히어로 */
.hero{background:linear-gradient(135deg,var(--gold) 0%,var(--gd) 100%);padding:40px 20px 52px;text-align:center;border-radius:0 0 36px 36px;box-shadow:var(--smd);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:rgba(255,255,255,.12);border-radius:50%;}
.hero::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero-mascot{font-size:62px;display:block;margin-bottom:10px;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2));position:relative;z-index:1;}
.hero-title{font-family:'Jua',sans-serif;font-size:36px;color:#4A2E00;letter-spacing:1px;position:relative;z-index:1;}
.hero-sub{color:#7B4B00;font-size:14px;margin-top:8px;font-weight:700;opacity:.9;position:relative;z-index:1;}

/* 알림 버튼 */
.notify-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--peach),#FF6B6B);color:#fff;border:none;border-radius:22px;font-family:'Pretendard',sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin:-26px 0 20px;position:relative;z-index:10;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--sp);border:4px solid var(--bg);}
.notify-btn:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 28px rgba(255,138,118,.35);}
.notify-btn.subscribed{background:linear-gradient(135deg,var(--mint),#12C2A3);box-shadow:0 8px 24px rgba(56,224,196,.35);}

/* 핀된 섹션 */
.pinned-section{margin-bottom:8px;}
.pinned-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#FF6B9D;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}

/* 오늘 카드 */
.today-card{background:var(--white);border-radius:24px;padding:22px;margin-bottom:16px;border:2px solid var(--gl);box-shadow:var(--smd);position:relative;overflow:hidden;}
.today-card.pinned-card{border-color:#FF6B9D;box-shadow:0 8px 24px rgba(255,107,157,.2);}
.today-badge{display:inline-flex;align-items:center;gap:4px;background:var(--gl);color:#7B4B00;padding:5px 12px;border-radius:12px;font-size:11px;font-weight:800;margin-bottom:10px;animation:wiggle 2.5s ease-in-out infinite;}
.today-title{font-family:'Jua',sans-serif;font-size:21px;color:var(--tm);margin-bottom:6px;line-height:1.3;}
.today-desc{color:var(--ts);font-size:13px;line-height:1.6;}
.today-date{margin-top:12px;font-size:12px;color:var(--peach);font-weight:700;display:flex;align-items:center;gap:6px;}
.today-actions{display:flex;gap:8px;margin-top:14px;}
.link-btn{flex:1;padding:10px;background:linear-gradient(135deg,var(--gold),var(--gd));color:#5A3E00;border:none;border-radius:12px;font-family:'Pretendard',sans-serif;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .25s;}
.link-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,180,0,.3);}
.pin-btn{padding:10px 14px;background:var(--bg);border:2px solid var(--border);border-radius:12px;cursor:pointer;font-size:16px;transition:all .25s;color:var(--ts);}
.pin-btn.pinned{background:#FFF0F7;border-color:#FF6B9D;color:#FF6B9D;}
.pin-btn:hover{transform:scale(1.1);}

/* 할인 목록 */
.discount-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.discount-item{background:var(--white);border-radius:20px;padding:16px;border:1.5px solid var(--border);transition:all .3s;box-shadow:var(--ssm);cursor:pointer;position:relative;}
.discount-item:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--smd);}
.discount-item.today-item{border-color:var(--gold);background:#FFFAF0;}
.discount-item.past{opacity:.55;filter:grayscale(40%);box-shadow:none;}
.discount-item.pinned-item{border-color:#FF6B9D;background:#FFF8FC;}
.item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.item-left{flex:1;min-width:0;}
.item-date{font-size:11px;color:var(--ts);margin-bottom:4px;font-weight:600;}
.item-title{font-size:15px;font-weight:700;color:var(--tm);line-height:1.35;}
.item-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.item-badge{padding:5px 10px;border-radius:10px;font-size:10px;font-weight:800;white-space:nowrap;}
.badge-today{background:var(--gold);color:#5A3E00;}
.badge-upcoming{background:var(--bg);color:var(--ts);border:1px solid var(--border);}
.badge-past{background:#F5F5F5;color:#BDBDBD;}
.item-pin-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:2px;transition:transform .2s;opacity:.5;}
.item-pin-btn.pinned{opacity:1;}
.item-pin-btn:hover{transform:scale(1.2);}
.item-footer{display:flex;gap:6px;margin-top:10px;}
.item-link-btn{padding:7px 12px;background:linear-gradient(135deg,#749CFF,#5A81FA);color:#fff;border:none;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all .2s;}
.item-link-btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(116,156,255,.4);}

/* 캘린더 */
.cal-header{background:linear-gradient(135deg,#A8E6CF 0%,#38E0C4 100%);padding:34px 20px 44px;text-align:center;border-radius:0 0 36px 36px;box-shadow:var(--smd);position:relative;overflow:hidden;}
.cal-header::before{content:'';position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:rgba(255,255,255,.15);border-radius:50%;}
.cal-mascot{font-size:50px;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.1));position:relative;z-index:1;}
.cal-title{font-family:'Jua',sans-serif;font-size:26px;color:#0C5C4E;position:relative;z-index:1;}
.cal-sub{font-size:13px;color:#168C78;margin-top:5px;font-weight:700;position:relative;z-index:1;}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:20px;padding:11px 18px;margin:-22px auto 18px;border:2px solid var(--mint);box-shadow:0 8px 24px rgba(56,224,196,.18);max-width:300px;position:relative;z-index:10;}
.month-nav-btn{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--mint);transition:transform .2s;padding:4px 10px;border-radius:10px;}
.month-nav-btn:hover{transform:scale(1.2);background:rgba(56,224,196,.1);}
.month-label{font-family:'Jua',sans-serif;font-size:21px;color:var(--tm);}
.cal-grid-wrap{background:var(--white);border-radius:22px;padding:16px 8px;border:1px solid var(--border);box-shadow:var(--ssm);margin-bottom:20px;overflow:hidden;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:10px;}
.cal-weekday{text-align:center;font-family:'Jua',sans-serif;font-size:12px;padding:4px 0;}
.cal-weekday:first-child{color:var(--peach);}
.cal-weekday:last-child{color:#64B5F6;}
.cal-weekday:not(:first-child):not(:last-child){color:var(--ts);}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:0;}
.cal-day{display:flex;flex-direction:column;align-items:center;padding:5px 0 4px;cursor:pointer;transition:background .2s;position:relative;border:2px solid transparent;min-height:56px;border-radius:0;}
.cal-day:hover:not(.empty){background:var(--gl);}
.cal-day.empty{cursor:default;}
.cal-day.today{background:linear-gradient(135deg,var(--gold),var(--gd));box-shadow:0 4px 12px rgba(255,180,0,.4);border-radius:10px;z-index:2;}
.cal-day.today .day-num{color:#5A3E00;font-weight:900;}
.cal-day.selected{border-color:var(--mint);background:rgba(56,224,196,.12);border-radius:10px;}
.cal-day.past-day .day-num{color:#D1C9C1;}
.day-num{font-family:'Jua',sans-serif;font-size:13px;color:var(--tm);line-height:1;margin-bottom:3px;}
.cal-day.sun .day-num{color:var(--peach);}
.cal-day.today .day-num{color:#5A3E00!important;}
/* 할인 바 - 이어지는 디자인 */
.disc-bars{display:flex;flex-direction:column;gap:2px;width:100%;padding:0;}
.disc-bar{width:100%;font-size:8px;font-weight:700;color:#fff;padding:1px 3px;border-radius:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;min-height:11px;display:block;}
.disc-bar.bar-start{border-radius:6px 0 0 6px;padding-left:5px;}
.disc-bar.bar-mid{border-radius:0;opacity:.9;}
.disc-bar.bar-end{border-radius:0 6px 6px 0;}
.disc-bar.bar-single{border-radius:6px;padding-left:5px;}
.disc-bar.bar-pin{outline:2px solid rgba(255,107,157,.7);outline-offset:-1px;}

/* 선택 디테일 */
.selected-detail{background:var(--white);border-radius:20px;padding:18px;border:2px solid var(--mint);box-shadow:0 8px 24px rgba(56,224,196,.18);margin-bottom:20px;animation:fadeIn .3s ease;}
.selected-date-label{font-family:'Jua',sans-serif;font-size:17px;color:var(--mint);margin-bottom:14px;text-align:center;}
.selected-item{padding:14px;background:var(--bg);border-radius:14px;margin-bottom:8px;border:1px solid var(--border);}
.selected-item-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.selected-item-color{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.selected-item-title{font-size:14px;font-weight:800;color:var(--tm);}
.selected-item-desc{font-size:12px;color:var(--ts);line-height:1.6;margin-bottom:8px;}
.selected-item-link{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:linear-gradient(135deg,#749CFF,#5A81FA);color:#fff;border-radius:10px;font-size:11px;font-weight:700;text-decoration:none;transition:all .2s;}
.selected-item-link:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(116,156,255,.4);}
.no-discount-msg{text-align:center;padding:16px;color:var(--ts);font-size:13px;font-weight:600;}

/* 요약 */
.summary-item{background:var(--white);border-radius:18px;padding:14px;border:1.5px solid var(--border);display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:all .3s;cursor:pointer;}
.summary-item:hover{border-color:var(--peach);transform:translateX(4px);box-shadow:var(--ssm);}
.summary-item.pinned-summary{border-color:#FF6B9D;background:#FFF8FC;}
.summary-date-badge{background:var(--bg);color:var(--ts);border-radius:14px;padding:8px 10px;font-family:'Jua',sans-serif;font-size:14px;text-align:center;min-width:50px;border:1px solid var(--border);flex-shrink:0;}
.summary-date-badge.highlight{background:var(--gold);color:#5A3E00;border-color:var(--gold);box-shadow:0 4px 10px rgba(255,201,60,.3);}
.summary-color-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.summary-info{flex:1;min-width:0;}
.summary-title{font-size:14px;font-weight:700;margin-bottom:3px;color:var(--tm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.summary-day{font-size:11px;color:var(--ts);font-weight:600;}
.summary-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.summary-link{padding:5px 10px;background:linear-gradient(135deg,#749CFF,#5A81FA);color:#fff;border-radius:8px;font-size:10px;font-weight:700;text-decoration:none;transition:all .2s;}
.summary-link:hover{transform:translateY(-1px);}
.summary-emoji{font-size:20px;}

/* 관리자 */
.admin-hero{background:linear-gradient(135deg,#749CFF 0%,#A2B9FF 100%);padding:34px 20px 44px;text-align:center;border-radius:0 0 36px 36px;box-shadow:var(--smd);}
.admin-mascot{font-size:50px;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.1));}
.admin-title{font-family:'Jua',sans-serif;font-size:26px;color:#1E3A8A;}
.admin-sub{font-size:13px;color:#3B5BBD;margin-top:5px;font-weight:700;}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px;margin-top:-18px;position:relative;z-index:10;}
.stat-card{background:var(--white);border-radius:20px;padding:18px;border:2px solid #D5E0FF;text-align:center;box-shadow:var(--ssm);}
.stat-num{font-family:'Jua',sans-serif;font-size:34px;color:#5A81FA;}
.stat-label{font-size:12px;color:var(--ts);margin-top:3px;font-weight:700;}
.form-card{background:var(--white);border-radius:22px;padding:22px;border:1px solid var(--border);box-shadow:var(--ssm);margin-bottom:26px;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:12px;color:var(--ts);margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.form-input,.form-textarea{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:14px;color:var(--tm);font-family:'Pretendard',sans-serif;font-size:14px;font-weight:600;transition:all .3s;outline:none;box-sizing:border-box;}
.form-input:focus,.form-textarea:focus{border-color:var(--gold);background:var(--white);box-shadow:0 0 0 4px rgba(255,201,60,.15);}
.form-textarea{resize:vertical;min-height:90px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--gold),var(--gd));color:#5A3E00;border:none;border-radius:14px;font-family:'Pretendard',sans-serif;font-weight:800;font-size:15px;cursor:pointer;transition:all .3s;box-shadow:0 6px 20px rgba(255,201,60,.3);}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,201,60,.4);}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.admin-item{background:var(--white);border-radius:18px;padding:16px;margin-bottom:10px;border:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;transition:all .2s;}
.admin-item:hover{border-color:var(--gold);box-shadow:var(--ssm);}
.admin-item-color{width:8px;height:8px;border-radius:2px;margin-top:4px;flex-shrink:0;}
.admin-item-info{flex:1;min-width:0;}
.admin-item-date{font-size:11px;color:var(--peach);margin-bottom:3px;font-weight:700;}
.admin-item-title{font-size:14px;font-weight:800;margin-bottom:3px;color:var(--tm);}
.admin-item-desc{font-size:12px;color:var(--ts);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.delete-btn{background:var(--bg);color:var(--ts);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.delete-btn:hover{background:#FFE5E5;color:#FF4D4D;border-color:#FF4D4D;}

/* 비밀번호 팝업 */
.pw-overlay{position:fixed;inset:0;background:rgba(253,251,247,.88);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(12px);}
.pw-box{background:var(--white);border-radius:30px;padding:38px 28px;width:88%;max-width:320px;border:1.5px solid var(--border);text-align:center;box-shadow:0 24px 48px rgba(150,130,110,.18);animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
.pw-icon{font-size:58px;margin-bottom:14px;display:block;}
.pw-title{font-family:'Jua',sans-serif;font-size:23px;color:var(--tm);margin-bottom:6px;}
.pw-sub{font-size:13px;color:var(--ts);margin-bottom:22px;font-weight:600;line-height:1.5;}
.pw-input{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:15px;font-size:22px;text-align:center;letter-spacing:8px;outline:none;margin-bottom:16px;transition:all .3s;color:var(--tm);}
.pw-input:focus{border-color:var(--gold);background:var(--white);box-shadow:0 0 0 4px rgba(255,201,60,.15);}

/* 비밀번호 변경 섹션 */
.pw-change-card{background:var(--white);border-radius:22px;padding:20px;border:2px solid #D5E0FF;box-shadow:var(--ssm);margin-bottom:20px;}
.pw-change-title{font-family:'Jua',sans-serif;font-size:16px;color:#5A81FA;margin-bottom:14px;display:flex;align-items:center;gap:6px;}

/* 로딩 */
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;}
.loading-spinner{font-size:58px;animation:bounce 1s infinite;margin-bottom:18px;}
.loading-text{font-family:'Jua',sans-serif;font-size:20px;color:var(--tm);}
.empty-state{text-align:center;padding:38px 20px;}
.empty-icon{font-size:52px;margin-bottom:14px;display:block;opacity:.8;}
.empty-text{font-size:14px;font-weight:700;color:var(--ts);}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(50px);background:rgba(74,63,53,.95);color:#fff;padding:14px 26px;border-radius:40px;font-size:13px;font-weight:700;transition:all .4s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;box-shadow:0 12px 32px rgba(0,0,0,.2);opacity:0;pointer-events:none;backdrop-filter:blur(4px);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success{background:rgba(56,224,196,.95);color:#0C5C4E;}
.toast.error{background:rgba(255,138,118,.95);color:#661A0F;}
</style>
</head>
<body>
<div class="float-bg" id="floatBg"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner">✨</div>
  <div class="loading-text">금고를 여는 중...</div>
</div>
<div class="tab-nav">
  <button class="tab-btn active" id="tbtn-user" onclick="switchTab('user')">홈 🏠</button>
  <button class="tab-btn" id="tbtn-cal" onclick="switchTab('cal')">캘린더 📅</button>
  <button class="tab-btn" id="tbtn-admin" onclick="switchTab('admin')">관리자 👑</button>
</div>

<!-- 홈 -->
<div id="tab-user" class="tab-content active">
  <div class="hero">
    <span class="hero-mascot">👑</span>

<script>
var FIREBASE_URL = 'https://littlewonju-default-rtdb.firebaseio.com';
var BAR_COLORS = ['#FF8A76','#749CFF','#38E0C4','#FFB347','#FF6B9D','#A8D8A8','#C084FC','#60A5FA'];
var allData = [];
var pinnedIds = JSON.parse(localStorage.getItem('pinnedIds') || '[]');
var ADMIN_PW_KEY = 'adminPw_littlewonju';

function getAdminPw() { return localStorage.getItem(ADMIN_PW_KEY) || '1234'; }

// Firebase
async function fetchData() {
  try {
    var res = await fetch(FIREBASE_URL + '/discounts.json');
    if (!res.ok) throw new Error('fetch fail');
    var json = await res.json();
    if (json) {
      allData = Object.keys(json).map(function(k) {
        return Object.assign({ fireKey: k }, json[k]);
      }).sort(function(a, b) { return a.date.localeCompare(b.date); });
    } else { allData = []; }
  } catch(e) {
    showToast('⚠️ 데이터를 불러오지 못했어요', 'error');
    allData = [];
  } finally {
    var ov = document.getElementById('loadingOverlay');
    if (ov) { ov.style.opacity = '0'; setTimeout(function() { ov.style.display = 'none'; }, 300); }
  }
}

// 유틸
function getToday() { return new Date().toISOString().split('T')[0]; }
function formatDate(d) {
  var dt = new Date(d + 'T00:00:00');
  return (dt.getMonth()+1) + '월 ' + dt.getDate() + '일 (' + ['일','월','화','수','목','금','토'][dt.getDay()] + ')';
}
function formatPeriod(s, e) {
  if (!e || e === s) return formatDate(s);
  var ds = new Date(s+'T00:00:00'), de = new Date(e+'T00:00:00');
  if (ds.getMonth() === de.getMonth()) {
    return (ds.getMonth()+1)+'월 '+ds.getDate()+'일 ~ '+de.getDate()+'일';
  }
  return formatDate(s) + ' ~ ' + formatDate(e);
}
function isInPeriod(item, d) {
  var end = item.endDate || item.date;
  return item.date <= d && d <= end;
}
function getItemColor(item) {
  var idx = allData.indexOf(item);
  if (idx < 0) {
    for (var i = 0; i < allData.length; i++) {
      if (allData[i].fireKey === item.fireKey) { idx = i; break; }
    }
  }
  return BAR_COLORS[idx % BAR_COLORS.length];
}
function isPinned(item) { return pinnedIds.indexOf(item.fireKey) >= 0; }
function togglePin(fireKey) {
  var idx = pinnedIds.indexOf(fireKey);
  if (idx >= 0) pinnedIds.splice(idx, 1);
  else pinnedIds.unshift(fireKey);
  localStorage.setItem('pinnedIds', JSON.stringify(pinnedIds));
  renderAll();
}

// 홈 렌더링
function renderUser() {
  var today = getToday();
  var sorted = allData.slice().sort(function(a, b) { return a.date.localeCompare(b.date); });
  var todayItems = sorted.filter(function(item) { return isInPeriod(item, today); });
  var sec = document.getElementById('todaySection');

  // 핀된 항목
  var pinnedItems = sorted.filter(function(item) { return isPinned(item); });
  var pinnedHtml = '';
  if (pinnedItems.length > 0) {
    pinnedHtml = '<div class="pinned-section"><div class="pinned-label">📌 내가 찜한 혜택</div>';
    pinnedItems.forEach(function(item) {
      var color = getItemColor(item);
      var isActive = isInPeriod(item, today);
      pinnedHtml += '<div class="today-card pinned-card" style="border-left:5px solid '+color+'">';
      pinnedHtml += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      pinnedHtml += '<div class="today-badge" style="background:'+color+'20;color:'+color+'">📌 찜한 혜택'+(isActive?' · 진행중':'')+'</div>';
      pinnedHtml += '<button class="pin-btn pinned" onclick="togglePin(\''+item.fireKey+'\')" title="찜 해제">📌</button></div>';
      pinnedHtml += '<div class="today-title">'+item.title+'</div>';
      if (item.desc) pinnedHtml += '<div class="today-desc">'+item.desc.replace(/\n/g,'<br>')+'</div>';
      pinnedHtml += '<div class="today-date">📅 '+formatPeriod(item.date, item.endDate)+'</div>';
      if (item.link) {
        pinnedHtml += '<div class="today-actions"><a class="link-btn" href="'+item.link+'" target="_blank" rel="noopener">🔗 할인 사이트 바로가기</a></div>';
      }
      pinnedHtml += '</div>';
    });
    pinnedHtml += '</div>';
  }

  // 오늘의 혜택
  var todayHtml = '';
  if (todayItems.length > 0) {
    todayItems.forEach(function(item) {
      var color = getItemColor(item);
      var pinned = isPinned(item);
      todayHtml += '<div class="today-card" style="border-left:5px solid '+color+'">';
      todayHtml += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      todayHtml += '<div class="today-badge">🔥 오늘의 꿀혜택!</div>';
      todayHtml += '<button class="pin-btn'+(pinned?' pinned':'')+'" onclick="togglePin(\''+item.fireKey+'\')" title="'+(pinned?'찜 해제':'찜하기')+'">📌</button></div>';
      todayHtml += '<div class="today-title">'+item.title+'</div>';
      if (item.desc) todayHtml += '<div class="today-desc">'+item.desc.replace(/\n/g,'<br>')+'</div>';
      todayHtml += '<div class="today-date">📅 '+formatPeriod(item.date, item.endDate)+'</div>';
      if (item.link) {
        todayHtml += '<div class="today-actions"><a class="link-btn" href="'+item.link+'" target="_blank" rel="noopener">🔗 할인 사이트 바로가기</a></div>';
      }
      todayHtml += '</div>';
    });
  } else {
    todayHtml = '<div class="today-card" style="text-align:center;padding:30px 20px;border-style:dashed"><div style="font-size:42px;margin-bottom:10px">🕊️</div><div style="color:var(--tm);font-weight:700;font-size:15px">오늘은 예정된 할인이 없어요</div><div style="color:var(--ts);font-size:12px;margin-top:5px">돈 굳었다! 저축하는 날 🐷</div></div>';
  }
  sec.innerHTML = pinnedHtml + todayHtml;

  // 이번달 목록
  var thisMonth = new Date().toISOString().slice(0,7);
  var monthItems = sorted.filter(function(item) {
    var end = item.endDate || item.date;
    return item.date.startsWith(thisMonth) || (end >= thisMonth+'-01' && item.date <= thisMonth+'-31');
  });
  var list = document.getElementById('discountList');
  if (monthItems.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><div class="empty-text">이번 달 등록된 혜택이 없어요</div></div>';
    return;
  }
  list.innerHTML = monthItems.map(function(item) {
    var isToday = isInPeriod(item, today);
    var isPast = (item.endDate || item.date) < today;
    var pinned = isPinned(item);
    var cls = (isToday ? 'today-item' : isPast ? 'past' : '') + (pinned ? ' pinned-item' : '');
    var color = getItemColor(item);
    var badge = isToday ? '<span class="item-badge badge-today">진행중!</span>' : isPast ? '<span class="item-badge badge-past">종료</span>' : '<span class="item-badge badge-upcoming">예정</span>';
    var footer = item.link ? '<div class="item-footer"><a class="item-link-btn" href="'+item.link+'" target="_blank" rel="noopener">🔗 바로가기</a></div>' : '';
    return '<div class="discount-item '+cls+'">'+
      '<div class="item-header">'+
        '<div class="item-left">'+
          '<div class="item-date" style="color:'+color+'">'+formatPeriod(item.date, item.endDate)+(pinned?' 📌':'')+'</div>'+
          '<div class="item-title">'+item.title+'</div>'+
        '</div>'+
        '<div class="item-right">'+
          badge+
          '<button class="item-pin-btn'+(pinned?' pinned':'')+'" onclick="event.stopPropagation();togglePin(\''+item.fireKey+'\')">📌</button>'+
        '</div>'+
      '</div>'+
      footer+
    '</div>';
  }).join('');
}

// 캘린더
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();
var selectedDate = null;

function renderCalendar() {
  var today = getToday();
  document.getElementById('monthLabel').textContent = calYear+'년 '+(calMonth+1)+'월';
  var firstDay = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var monthStr = calYear+'-'+String(calMonth+1).padStart(2,'0');

  // 날짜별 할인 매핑
  var discountDates = {};
  allData.forEach(function(item, globalIdx) {
    var end = item.endDate || item.date;
    for (var d = 1; d <= daysInMonth; d++) {
      var ds = monthStr+'-'+String(d).padStart(2,'0');
      if (item.date <= ds && ds <= end) {
        if (!discountDates[ds]) discountDates[ds] = [];
        discountDates[ds].push({ item: item, color: BAR_COLORS[globalIdx % BAR_COLORS.length] });
      }
    }
  });

  var html = '';
  for (var i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = monthStr+'-'+String(d).padStart(2,'0');
    var isToday = dateStr === today;
    var isPast = dateStr < today;
    var isSelected = dateStr === selectedDate;
    var dayOfWeek = (firstDay + d - 1) % 7;
    var cls = '';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    if (isPast && !isToday) cls += ' past-day';
    if (dayOfWeek === 0) cls += ' sun';

    var barsHtml = '';
    if (discountDates[dateStr]) {
      barsHtml = '<div class="disc-bars">';
      discountDates[dateStr].forEach(function(entry) {
        var item = entry.item;
        var color = entry.color;
        var end = item.endDate || item.date;
        var isFirst = item.date === dateStr;
        var isLast = end === dateStr;
        var isSingle = item.date === end;
        var barCls = isSingle ? 'disc-bar bar-single' : (isFirst ? 'disc-bar bar-start' : (isLast ? 'disc-bar bar-end' : 'disc-bar bar-mid'));
        if (isPinned(item)) barCls += ' bar-pin';
        var label = isFirst ? item.title : '';
        barsHtml += '<div class="'+barCls+'" style="background:'+color+'" title="'+item.title+'">'+label+'</div>';
      });
      barsHtml += '</div>';
    }
    html += '<div class="cal-day'+cls+'" onclick="selectDay(\''+dateStr+'\')"><div class="day-num">'+d+'</div>'+barsHtml+'</div>';
  }
  document.getElementById('calDays').innerHTML = html;
  renderSelectedDetail(discountDates);
  renderCalSummary(monthStr);
}

function selectDay(dateStr) {
  selectedDate = (selectedDate === dateStr) ? null : dateStr;
  renderCalendar();
}

function renderSelectedDetail(discountDates) {
  var el = document.getElementById('selectedDetail');
  if (!selectedDate) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (!discountDates[selectedDate] || discountDates[selectedDate].length === 0) {
    el.innerHTML = '<div class="selected-detail"><div class="selected-date-label">📅 '+formatDate(selectedDate)+'</div><div class="no-discount-msg">이 날은 혜택이 없어요 🥲</div></div>';
    return;
  }
  var entries = discountDates[selectedDate];
  var items = entries.map(function(e) {
    var item = e.item, color = e.color;
    var pinned = isPinned(item);
    return '<div class="selected-item">'+
      '<div class="selected-item-header">'+
        '<div class="selected-item-color" style="background:'+color+'"></div>'+
        '<div class="selected-item-title">'+item.title+(pinned?' 📌':'')+'</div>'+
      '</div>'+
      (item.desc ? '<div class="selected-item-desc">'+item.desc.replace(/\n/g,'<br>')+'</div>' : '')+
      (item.link ? '<a class="selected-item-link" href="'+item.link+'" target="_blank" rel="noopener">🔗 할인 사이트 바로가기</a>' : '')+
    '</div>';
  }).join('');
  el.innerHTML = '<div class="selected-detail"><div class="selected-date-label">📅 '+formatDate(selectedDate)+' 혜택</div>'+items+'</div>';
}

function renderCalSummary(monthStr) {
  var today = getToday();
  var monthItems = allData.filter(function(item) {
    var end = item.endDate || item.date;
    return item.date.startsWith(monthStr) || (end >= monthStr+'-01' && item.date <= monthStr+'-31');
  }).sort(function(a,b){return a.date.localeCompare(b.date);});
  var el = document.getElementById('calSummary');
  if (monthItems.length === 0) {
    el.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><div class="empty-text">이번 달 스케줄이 없어요</div></div>';
    return;
  }
  el.innerHTML = monthItems.map(function(item) {
    var d = new Date(item.date+'T00:00:00');
    var isPast = (item.endDate||item.date) < today;
    var isActive = isInPeriod(item, today);
    var color = getItemColor(item);
    var pinned = isPinned(item);
    var badgeCls = isActive ? 'summary-date-badge highlight' : 'summary-date-badge';
    var linkHtml = item.link ? '<a class="summary-link" href="'+item.link+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗</a>' : '';
    return '<div class="summary-item'+(pinned?' pinned-summary':'')+'" onclick="selectDay(\''+item.date+'\')" style="'+(isPast?'opacity:.55':'')+'">'+
      '<div class="'+badgeCls+'">'+d.getDate()+'일<br><span style="font-size:10px">'+['일','월','화','수','목','금','토'][d.getDay()]+'</span></div>'+
      '<div class="summary-color-dot" style="background:'+color+'"></div>'+
      '<div class="summary-info">'+
        '<div class="summary-title">'+(pinned?'📌 ':'')+item.title+'</div>'+
        '<div class="summary-day">'+formatPeriod(item.date, item.endDate)+' · '+(isActive?'🔥 진행중':isPast?'종료됨':'예정됨')+'</div>'+
      '</div>'+
      '<div class="summary-right">'+linkHtml+'<div class="summary-emoji">'+(isActive?'🎁':isPast?'✅':'⏰')+'</div></div>'+
    '</div>';
  }).join('');
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  selectedDate = null;
  renderCalendar();
}

// 관리자
function renderAdmin() {
  var today = getToday();
  var sorted = allData.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  document.getElementById('totalCount').textContent = allData.length;
  document.getElementById('upcomingCount').textContent = allData.filter(function(d){ return (d.endDate||d.date) >= today; }).length;
  var list = document.getElementById('adminList');
  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">📝</span><div class="empty-text">등록된 혜택이 없어요<br>위에서 추가해주세요!</div></div>';
    return;
  }
  list.innerHTML = sorted.map(function(item) {
    var color = getItemColor(item);
    return '<div class="admin-item">'+
      '<div class="admin-item-color" style="background:'+color+'"></div>'+
      '<div class="admin-item-info">'+
        '<div class="admin-item-date">📅 '+formatPeriod(item.date, item.endDate)+'</div>'+
        '<div class="admin-item-title">'+item.title+'</div>'+
        (item.link ? '<div class="admin-item-desc">🔗 '+item.link+'</div>' : (item.desc ? '<div class="admin-item-desc">'+item.desc.replace(/\n/g,' · ')+'</div>' : ''))+
      '</div>'+
      '<button class="delete-btn" onclick="deleteDiscount(\''+item.fireKey+'\')">삭제</button>'+
    '</div>';
  }).join('');
}

async function addDiscount() {
  var date = document.getElementById('inputDate').value;
  var endDate = document.getElementById('inputEndDate').value;
  var title = document.getElementById('inputTitle').value.trim();
  var link = document.getElementById('inputLink').value.trim();
  var desc = document.getElementById('inputDesc').value.trim();
  if (!date) { showToast('📅 시작일을 선택해주세요!', 'error'); return; }
  if (!endDate) { endDate = date; }
  if (endDate < date) { showToast('⚠️ 종료일이 시작일보다 빠를 수 없어요!', 'error'); return; }
  if (!title) { showToast('✏️ 혜택 이름을 적어주세요!', 'error'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '저장 중... ⏳';
  try {
    var payload = { date: date, endDate: endDate, title: title, desc: desc };
    if (link) payload.link = link;
    var res = await fetch(FIREBASE_URL + '/discounts.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error();
    document.getElementById('inputDate').value = getToday();
    document.getElementById('inputEndDate').value = getToday();
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputLink').value = '';
    document.getElementById('inputDesc').value = '';
    await fetchData(); renderAll();
    showToast('🎉 금고에 저장 완료!', 'success');
  } catch(e) { showToast('❌ 등록에 실패했어요', 'error'); }
  finally { btn.disabled = false; btn.textContent = '금고에 저장하기 💰'; }
}

async function deleteDiscount(fireKey) {
  if (!confirm('정말 이 혜택을 삭제하시겠어요?')) return;
  try {
    var res = await fetch(FIREBASE_URL + '/discounts/' + fireKey + '.json', { method: 'DELETE' });
    if (!res.ok) throw new Error();
    pinnedIds = pinnedIds.filter(function(id) { return id !== fireKey; });
    localStorage.setItem('pinnedIds', JSON.stringify(pinnedIds));
    await fetchData(); renderAll();
    showToast('🗑️ 삭제 완료!', '');
  } catch(e) { showToast('❌ 삭제에 실패했어요', 'error'); }
}

function renderAll() { renderUser(); renderCalendar(); renderAdmin(); }

// 알림
var isSubscribed = localStorage.getItem('notifSub') === 'true';
function toggleNotification() {
  if (!('Notification' in window)) { showToast('알림을 지원하지 않는 기기예요', 'error'); return; }
  if (isSubscribed) {
    isSubscribed = false; localStorage.setItem('notifSub','false'); updateNotifyBtn();
    showToast('🔕 알림을 껐어요',''); return;
  }
  Notification.requestPermission().then(function(p) {
    if (p === 'granted') {
      isSubscribed = true; localStorage.setItem('notifSub','true'); updateNotifyBtn();
      showToast('🔔 알림 설정 완료!','success');
      new Notification('👑 리틀원주방', { body: '이제 부자 될 일만 남았어요! 💎' });
    } else { showToast('브라우저 알림 권한을 허용해주세요','error'); }
  });
}
function updateNotifyBtn() {
  var btn = document.getElementById('notifyBtn');
  if (isSubscribed) {
    btn.innerHTML = '✅ 알림 켜짐 <span style="font-size:12px;opacity:.8">(끄려면 클릭)</span>';
    btn.classList.add('subscribed');
  } else {
    btn.innerHTML = '🔔 할인 알림 받고 부자되기';
    btn.classList.remove('subscribed');
  }
}

// 탭
var adminUnlocked = false;
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('tbtn-'+tab).classList.add('active');
  if (tab === 'admin' && !adminUnlocked) {
    document.getElementById('pwOverlay').style.display = 'flex';
    document.getElementById('pwInput').focus();
  }
  if (tab === 'cal') renderCalendar();
  window.scrollTo(0,0);
}

// 비밀번호
function checkPw() {
  var val = document.getElementById('pwInput').value;
  if (val === getAdminPw()) {
    adminUnlocked = true;
    document.getElementById('pwOverlay').style.display = 'none';
    renderAdmin();
  } else {
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').style.borderColor = '#FF4D4D';
    showToast('❌ 비밀번호가 틀렸어요!','error');
    setTimeout(function() { document.getElementById('pwInput').style.borderColor = 'var(--border)'; }, 1000);
  }
}

function changePw() {
  var cur = document.getElementById('pwCurrent').value;
  var nw = document.getElementById('pwNew').value;
  var cf = document.getElementById('pwConfirm').value;
  if (cur !== getAdminPw()) { showToast('❌ 현재 비밀번호가 틀렸어요!','error'); return; }
  if (!nw || nw.length < 4) { showToast('⚠️ 새 비밀번호는 4자 이상이어야 해요!','error'); return; }
  if (nw !== cf) { showToast('⚠️ 새 비밀번호가 일치하지 않아요!','error'); return; }
  localStorage.setItem(ADMIN_PW_KEY, nw);
  document.getElementById('pwCurrent').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwConfirm').value = '';
  showToast('🔒 비밀번호가 변경됐어요!','success');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// 배경 이모지
var emojis = ['💎','💰','✨','👑','💳','💸','🛍️','🥂','🌟','💫'];
var floatBg = document.getElementById('floatBg');
for (var i = 0; i < 14; i++) {
  var el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = emojis[i % emojis.length];
  el.style.left = (Math.random()*92)+'%';
  el.style.animationDuration = (12+Math.random()*16)+'s';
  el.style.animationDelay = (Math.random()*12)+'s';
  el.style.fontSize = (18+Math.random()*18)+'px';
  floatBg.appendChild(el);
}

// 초기화
document.getElementById('inputDate').value = getToday();
document.getElementById('inputEndDate').value = getToday();
document.getElementById('inputDate').addEventListener('change', function() {
  var ed = document.getElementById('inputEndDate');
  if (ed.value < this.value) ed.value = this.value;
});
updateNotifyBtn();
fetchData().then(function() { renderUser(); renderCalendar(); });
</script>
